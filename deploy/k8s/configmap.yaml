apiVersion: v1
kind: ConfigMap
metadata:
  name: inspect-agent-config
  namespace: inspect-agent
  labels:
    app.kubernetes.io/name: inspect-agent
data:
  ZHIPU_MODEL: "glm-5.3"
  ZHIPU_BASE_URL: ""
  ZHIPU_TIMEOUT_SECONDS: "180"
  PROMETHEUS_URL: "http://prometheus.monitoring.svc.cluster.local:9090"
  PROMETHEUS_TIMEOUT_SECONDS: "30"
  DEFAULT_TIME_RANGE: "2h"
  MAX_TOOL_ROUNDS: "1"
  THRESHOLD_CPU_WARNING: "80"
  THRESHOLD_CPU_CRITICAL: "90"
  THRESHOLD_MEMORY_WARNING: "80"
  THRESHOLD_MEMORY_CRITICAL: "90"
  THRESHOLD_DISK_WARNING: "80"
  THRESHOLD_DISK_CRITICAL: "90"
  THRESHOLD_DISK_IO_UTIL_WARNING: "80"
  THRESHOLD_DISK_IO_UTIL_CRITICAL: "90"
  THRESHOLD_LOAD1_WARNING: "4"
  THRESHOLD_LOAD1_CRITICAL: "8"
  THRESHOLD_NETWORK_RX_MBPS_WARNING: "800"
  THRESHOLD_NETWORK_RX_MBPS_CRITICAL: "950"
  THRESHOLD_NETWORK_TX_MBPS_WARNING: "800"
  THRESHOLD_NETWORK_TX_MBPS_CRITICAL: "950"
  THRESHOLD_REDIS_UP_WARNING: "0"
  THRESHOLD_REDIS_UP_CRITICAL: "0"
  THRESHOLD_REDIS_MEMORY_WARNING: "80"
  THRESHOLD_REDIS_MEMORY_CRITICAL: "90"
  THRESHOLD_REDIS_CLIENTS_WARNING: "5000"
  THRESHOLD_REDIS_CLIENTS_CRITICAL: "8000"
  THRESHOLD_REDIS_BLOCKED_WARNING: "10"
  THRESHOLD_REDIS_BLOCKED_CRITICAL: "50"
  THRESHOLD_REDIS_REJECTED_WARNING: "1"
  THRESHOLD_REDIS_REJECTED_CRITICAL: "5"
  THRESHOLD_REDIS_OPS_WARNING: "20000"
  THRESHOLD_REDIS_OPS_CRITICAL: "50000"
  THRESHOLD_KAFKA_BROKERS_WARNING: "2"
  THRESHOLD_KAFKA_BROKERS_CRITICAL: "1"
  THRESHOLD_KAFKA_UNDER_REPLICATED_WARNING: "1"
  THRESHOLD_KAFKA_UNDER_REPLICATED_CRITICAL: "1"
  THRESHOLD_KAFKA_OFFLINE_WARNING: "1"
  THRESHOLD_KAFKA_OFFLINE_CRITICAL: "1"
  THRESHOLD_KAFKA_LAG_WARNING: "10000"
  THRESHOLD_KAFKA_LAG_CRITICAL: "100000"
  THRESHOLD_K8S_RESTARTS_WARNING: "3"
  THRESHOLD_K8S_RESTARTS_CRITICAL: "10"
  THRESHOLD_K8S_CPU_WARNING: "80"
  THRESHOLD_K8S_CPU_CRITICAL: "95"
  THRESHOLD_K8S_MEMORY_WARNING: "80"
  THRESHOLD_K8S_MEMORY_CRITICAL: "95"
  THRESHOLD_K8S_NOT_READY_WARNING: "1"
  THRESHOLD_K8S_NOT_READY_CRITICAL: "1"
  INSPECTION_INSTRUCTION: "查询服务器 192.168.59.130 的 cpu"
