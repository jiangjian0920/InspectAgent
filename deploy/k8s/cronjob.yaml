apiVersion: batch/v1
kind: CronJob
metadata:
  name: inspect-agent
  namespace: inspect-agent
  labels:
    app.kubernetes.io/name: inspect-agent
    app.kubernetes.io/component: cron
spec:
  schedule: "0 */2 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: inspect-agent
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: inspect-agent
              image: inspect-agent:v1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - python main.py "$INSPECTION_INSTRUCTION"
              envFrom:
                - configMapRef:
                    name: inspect-agent-config
                - secretRef:
                    name: inspect-agent-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
