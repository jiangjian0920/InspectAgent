apiVersion: batch/v1
kind: CronJob
metadata:
  name: inspect-agent-schedule
  namespace: inspect-agent
  labels:
    app.kubernetes.io/name: inspect-agent
    app.kubernetes.io/component: cronjob
spec:
  # 默认暂停，确认策略与影响后再启用
  suspend: true
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: inspect-agent
            app.kubernetes.io/component: cronjob
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: inspect
              image: inspect-agent:v1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - 'python -m app --json "$INSPECTION_INSTRUCTION"'
              env:
                - name: CONFIG_DIR
                  value: /app/configs
              envFrom:
                - configMapRef:
                    name: inspect-agent-env
                - secretRef:
                    name: inspect-agent-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: configs
                  mountPath: /app/configs
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: configs
              configMap:
                name: inspect-agent-configs
            - name: tmp
              emptyDir: {}
