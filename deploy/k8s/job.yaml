apiVersion: batch/v1
kind: Job
metadata:
  name: inspect-agent-once
  namespace: inspect-agent
  labels:
    app.kubernetes.io/name: inspect-agent
    app.kubernetes.io/component: once
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inspect-agent
        app.kubernetes.io/component: once
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inspect-agent
          image: inspect-agent:v1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - python main.py "$INSPECTION_INSTRUCTION"
          envFrom:
            - configMapRef:
                name: inspect-agent-config
            - secretRef:
                name: inspect-agent-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
