apiVersion: batch/v1
kind: Job
metadata:
  name: wanchi-once
  namespace: wanchi
  labels:
    app.kubernetes.io/name: wanchi
    app.kubernetes.io/component: job
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wanchi
        app.kubernetes.io/component: job
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inspect
          image: wanchi:v1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - 'python -m app --json "$INSPECTION_INSTRUCTION"'
          env:
            - name: CONFIG_DIR
              value: /app/configs
          envFrom:
            - configMapRef:
                name: wanchi-env
            - secretRef:
                name: wanchi-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: configs
              mountPath: /app/configs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: configs
          configMap:
            name: wanchi-configs
        - name: tmp
          emptyDir: {}
