apiVersion: apps/v1
kind: Deployment
metadata:
  name: inspect-agent
  namespace: inspect-agent
  labels:
    app.kubernetes.io/name: inspect-agent
    app.kubernetes.io/component: interactive
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inspect-agent
      app.kubernetes.io/component: interactive
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inspect-agent
        app.kubernetes.io/component: interactive
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inspect-agent
          image: inspect-agent:v1
          imagePullPolicy: IfNotPresent
          command:
            - sleep
            - infinity
          envFrom:
            - configMapRef:
                name: inspect-agent-config
            - secretRef:
                name: inspect-agent-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
